<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta name="author" content="{{ .Site.Params.author }}">
<link rel="canonical" href="{{ .Permalink }}">
<link rel="icon" href="{{ "images/favicon.png" | relURL }}">
{{ with .OutputFormats.Get "RSS" }}<link rel="alternate" type="application/rss+xml" title="{{ $.Site.Title }}" href="{{ .Permalink }}">{{ end }}
{{ template "_internal/opengraph.html" . }}
{{ template "_internal/twitter_cards.html" . }}
{{ template "_internal/schema.html" . }}
{{ if .IsPage }}<script type="application/ld+json">{"@context":"https://schema.org","@type":"BlogPosting","headline":{{ .Title | jsonify }},"description":{{ .Description | default .Summary | plainify | jsonify }},"datePublished":{{ .Date.Format "2006-01-02" | jsonify }},"dateModified":{{ .Lastmod.Format "2006-01-02" | jsonify }},"url":{{ .Permalink | jsonify }},"author":{"@type":"Person","name":{{ .Site.Params.author | jsonify }},"url":{{ .Site.BaseURL | jsonify }}},"keywords":{{ with .Params.tags }}{{ delimit . ", " | jsonify }}{{ else }}""{{ end }}}</script>{{ end }}
{{ if .IsHome }}<script type="application/ld+json">{"@context":"https://schema.org","@type":"Person","name":{{ .Site.Params.author | jsonify }},"url":{{ .Site.BaseURL | jsonify }},"jobTitle":"Tech Lead, backend and platform engineering","sameAs":["https://github.com/osmangoninahid","https://www.linkedin.com/in/osmangoninahid","https://x.com/osmangoninahid"]}</script>{{ end }}
{{ if .HasShortcode "mermaid" }}<script src="{{ "js/mermaid.min.js" | relURL }}"></script><script>mermaid.initialize({startOnLoad:true,look:"handDrawn",theme:window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"neutral",fontFamily:"IBM Plex Mono, monospace"});</script>{{ end }}
